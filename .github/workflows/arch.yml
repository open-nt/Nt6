# Builds, tests and packages Nt on Arch Linux (.pkg.tar.zst); packages are made with CPack.
# Also called by slsa.yml, which signs the packages with SLSA provenance.
name: Arch Linux

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Arch Linux (.pkg.tar.zst)
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install git
        run: pacman -Syu --noconfirm git

      - uses: actions/checkout@v4

      - name: Install dependencies
        run: packaging/install-deps.sh

      - name: Build, test, package and install the package
        run: packaging/build.sh --output dist --verify-install

      - uses: actions/upload-artifact@v4
        with:
          name: packages-arch
          path: dist/*
          if-no-files-found: error
