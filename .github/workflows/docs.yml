# Builds the documentation with NDoc and publishes it to GitHub Pages.
name: Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate documentation
        run: |
          cmake -S . -B build -DNT_BUILD_TESTS=OFF -DNT_BUILD_EXAMPLES=OFF
          cmake --build build --target docs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/doc/html

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
