# Builds, tests and packages Nt on Enterprise Linux 10 (.rpm); packages are made with CPack.
# Also called by slsa.yml, which signs the packages with SLSA provenance.
name: Enterprise Linux 10

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Enterprise Linux 10 (.rpm)
    runs-on: ubuntu-latest
    container: quay.io/rockylinux/rockylinux:10
    steps:
      - name: Install git
        run: dnf -y install git tar

      - uses: actions/checkout@v4

      - name: Install dependencies
        run: packaging/install-deps.sh

      - name: Build, test, package and install the package
        run: packaging/build.sh --output dist --verify-install

      - uses: actions/upload-artifact@v4
        with:
          name: packages-el10
          path: dist/*
          if-no-files-found: error
