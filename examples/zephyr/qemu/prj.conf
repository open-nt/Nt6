# Nt needs C++17 with the full standard library; CONFIG_NT selects the rest.
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_NT=y
CONFIG_NT_NETWORK=y
CONFIG_NT_HTTPSERVER=y
CONFIG_NT_TLS=y

# Nt allocates from the C library's heap, and its event loop runs on the main thread. The stacks of
# the threads that Nt starts come from the kernel heap.
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=1048576
CONFIG_MAIN_STACK_SIZE=16384
# Fills the stacks with a known pattern, so that the page can tell how much of one was ever used.
CONFIG_INIT_STACKS=y
CONFIG_HEAP_MEM_POOL_SIZE=131072

# TCP over the loopback interface: the application talks to itself.
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_LOOPBACK=y

# The Ethernet controller of the emulated board, on the network that QEMU's user mode provides: the board is
# 10.0.2.15 behind the gateway 10.0.2.2, and QEMU can forward a port of the host to the web page.
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="10.0.2.15"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
CONFIG_NET_CONFIG_MY_IPV4_GW="10.0.2.2"
CONFIG_ZVFS_OPEN_MAX=32
# Two servers, three clients and the three connections that the servers accept.
CONFIG_NET_MAX_CONTEXTS=16
CONFIG_NET_MAX_CONN=16
CONFIG_NET_PKT_RX_COUNT=32
CONFIG_NET_PKT_TX_COUNT=32
CONFIG_NET_BUF_RX_COUNT=64
CONFIG_NET_BUF_TX_COUNT=64

# The emulated board has no entropy source; never use this on a real device.
CONFIG_TEST_RANDOM_GENERATOR=y
