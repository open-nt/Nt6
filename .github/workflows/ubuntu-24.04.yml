# Builds, tests and packages Nt on Ubuntu 24.04 (.deb); packages are made with CPack.
# Also called by slsa.yml, which signs the packages with SLSA provenance.
name: Ubuntu 24.04

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Ubuntu 24.04 (.deb)
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    steps:
      - name: Install git
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates git

      - uses: actions/checkout@v4

      - name: Install dependencies
        run: packaging/install-deps.sh

      - name: Build, test, package and install the package
        run: packaging/build.sh --output dist --verify-install

      - uses: actions/upload-artifact@v4
        with:
          name: packages-ubuntu-24.04
          path: dist/*
          if-no-files-found: error
