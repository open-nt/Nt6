# Builds, tests and packages Nt on Enterprise Linux 9 (.rpm) for x86_64 and aarch64 (natively on
# GitHub's hosted arm64 runner); packages are made with CPack.
# Also called by slsa.yml, which signs the packages with SLSA provenance.
name: Enterprise Linux 9

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Enterprise Linux 9 (.rpm, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            artifact: packages-el9
          - arch: aarch64
            runner: ubuntu-24.04-arm
            artifact: packages-el9-aarch64
    container: quay.io/rockylinux/rockylinux:9
    steps:
      - name: Install git
        run: dnf -y install git tar

      - uses: actions/checkout@v4

      - name: Install dependencies
        run: packaging/install-deps.sh

      - name: Build, test, package and install the package
        run: packaging/build.sh --output dist --verify-install

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error
