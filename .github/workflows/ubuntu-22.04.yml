# Builds, tests and packages Nt on Ubuntu 22.04 (.deb) for amd64 and arm64; packages are made
# with CPack. arm64 builds natively on GitHub's hosted arm64 runner, since the build runs ntmoc
# and ntrcc and the package is installed and tested afterwards.
# Also called by slsa.yml, which signs the packages with SLSA provenance.
name: Ubuntu 22.04

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Ubuntu 22.04 (.deb, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            artifact: packages-ubuntu-22.04
          - arch: arm64
            runner: ubuntu-24.04-arm
            artifact: packages-ubuntu-22.04-arm64
    container: ubuntu:22.04
    steps:
      - name: Install git
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates git

      - uses: actions/checkout@v4

      - name: Install dependencies
        run: packaging/install-deps.sh

      - name: Build, test, package and install the package
        run: packaging/build.sh --output dist --verify-install

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error
