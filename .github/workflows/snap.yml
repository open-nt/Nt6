# Builds and smoke-tests the snap (snap/snapcraft.yaml) for amd64 and arm64, each
# natively on a GitHub-hosted runner of that architecture.
# Also called by slsa.yml, which signs the snap with SLSA provenance and, for a
# version tag, publishes it to the Snap Store (the publish job lives there, so a
# failed publish cannot block the release).
#
# Publishing needs the repository secret SNAPCRAFT_STORE_CREDENTIALS, made with:
#   snapcraft export-login --snaps open-nt6 --acls package_access,package_push,package_release -
# A version with a pre-release suffix (6.1.0-rc1) goes to the candidate channel;
# any other goes to stable.
name: Snap

on:
  push:
    branches: [main]
    paths: ["snap/**", ".github/workflows/snap.yml", "CMakeLists.txt", "cmake/**", "VERSION"]
  pull_request:
    branches: [main]
    paths: ["snap/**", ".github/workflows/snap.yml", "CMakeLists.txt", "cmake/**", "VERSION"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  # The arm64 snap is built natively on GitHub's hosted arm64 runner (free for
  # public repositories) and not cross-compiled: the build runs ntmoc and ntrcc,
  # and the snap is installed and run afterwards, both of which need the target
  # architecture.
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Snap
            arch: amd64
            runner: ubuntu-latest
            artifact: packages-snap
          - name: Snap (arm64)
            arch: arm64
            runner: ubuntu-24.04-arm
            artifact: packages-snap-arm64
    steps:
      - uses: actions/checkout@v4

      # The Snap Store sometimes times out from the hosted runners ("unable to contact snap store"),
      # and snapcore/action-build installs LXD and Snapcraft from it without retrying. Install them
      # first, retrying with a growing pause; the action then only refreshes them.
      - name: Install LXD and Snapcraft from the Snap Store
        run: |
          install() {
            for attempt in 1 2 3 4 5; do
              sudo snap install "$@" && return 0
              echo "::warning::snap install $* failed (attempt $attempt of 5)"
              sleep $((attempt * 30))
            done
            return 1
          }
          install lxd
          install snapcraft --classic --channel stable

      - name: Build the snap
        id: build
        continue-on-error: true
        uses: snapcore/action-build@v1

      # The build also fetches its base snap from the store: one more attempt after a pause, so that a
      # store timeout does not fail the job. A failure of this attempt fails the job.
      - name: Wait for the Snap Store
        if: steps.build.outcome == 'failure'
        run: sleep 60

      - name: Build the snap (second attempt)
        id: retry
        if: steps.build.outcome == 'failure'
        uses: snapcore/action-build@v1

      - name: Install the snap and run the tools
        env:
          SNAP_FILE: ${{ steps.build.outputs.snap || steps.retry.outputs.snap }}
        run: |
          case "$SNAP_FILE" in
          *_${{ matrix.arch }}.snap) ;;
          *) echo "::error::Expected a snap for ${{ matrix.arch }}, got $SNAP_FILE"; exit 1 ;;
          esac
          sudo snap install --dangerous "$SNAP_FILE"
          open-nt6.ntmoc --version
          open-nt6.ntrcc --version
          open-nt6.ndoc --version
          find /snap/open-nt6/current/usr/lib -name Nt6Config.cmake | grep -q .
          test "$(snap list open-nt6 | awk 'NR == 2 { print $2 }')" = "$(head -n 1 VERSION)"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ steps.build.outputs.snap || steps.retry.outputs.snap }}
          if-no-files-found: error
